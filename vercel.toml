"$schema" = "https://openapi.vercel.sh/vercel.json"

[services.web]
root = "frontend/"

[services.api]
root = "backend/"
entrypoint = "main:app"

[[rewrites]]
source = "/api/(.*)"
destination = { service = "api" }

[[rewrites]]
source = "/api"
destination = { service = "api" }

[[rewrites]]
source = "/(.*)"
destination = { service = "web" }
